## PostgreSQL DB - alwaysdata.net

spring.datasource.url=jdbc:postgresql://postgresql-database-db.alwaysdata.net:5432/database-db_dev 
spring.datasource.username=database-db
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

## Liquibase

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://postgresql-database-db.alwaysdata.net:5432/database-db_dev
spring.liquibase.user=database-db
spring.liquibase.password=postgres

# Disable SQL init
spring.sql.init.mode=never

