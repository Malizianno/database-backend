name: Java CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Run your H2 database tests
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with H2 (Maven)
        run: mvn clean test

  # Job 2: Run Qodana analysis at the exact same time
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2024.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  # Job 3 - Notify Render.com after the 2 jobs are completed
  deploy:
    needs: [ test-and-build, code-quality ] # The gatekeeper rule
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on main branch pushes
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d95pmltckfvc73bkmg6g?key=w-6jQ5gsGFw"